services:
  - type: web
    name: simplifier-2-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "Simplifier 2.0"
      - key: API_V1_STR
        value: "/api/v1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
