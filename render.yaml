services:
  - type: web
    name: simplifier-2-backend
    env: python
    region: singapore
    plan: standard
    buildCommand: "pip install -r backend/requirements.lock && python backend/scripts/check_runtime.py"
    startCommand: "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --no-access-log"
    healthCheckPath: /health
    envVars:
      - key: AUTH_MODE
        value: supabase
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: CORS_ORIGINS
        sync: false
      - key: OSM_DISCOVERY_ENABLED
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "MediInsight"
      - key: API_V1_STR
        value: "/api/v1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
