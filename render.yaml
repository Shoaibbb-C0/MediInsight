services:
  - type: web
    name: simplifier-2-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.lock"
    startCommand: "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "Simplifier 2.0"
      - key: API_V1_STR
        value: "/api/v1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
